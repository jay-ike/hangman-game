---
layout: "layouts/base.html"
---

<style>{%cssmin "includes/category.css"%}</style>
<style>{%cssmin "includes/header.css"%}</style>
<main aria-labelledby="main-title" class="stack main-wrapper">
    <div class="row heading" data-variant="title-only">
        <a class="shadowed rounded btn" data-theme="secondary" data-size="sm" href="/{{locale}}" style="view-transition-name: play-button;">
            <svg width="25" height="24">
                <title id="return">{{ "return_home" | i18n }}</title>
                <use href="/assets/images/sprites.svg#back" />
            </svg>
        </a>
        <h1 class="dilated-effect sky-text-bg capitalize" id="main-title">{{ "pick_category" | i18n }}</h1>
    </div>
    <nav aria-labelledby="categories-list">
        <h2 aria-hidden="true" class="visually-hidden" id="categories-list">{{ "available_categories" | i18n }}</h2>
        <ul class="responsive-grid categories" style="view-transition-name: main-content;">
            {%for category in categories%}
            <li class="contain"><a href="/{{locale}}/levels#{{category | encode_uri}}" class="center shadowed btn" style="view-transition-name: {{category | downcase | remove_accent}};">{{category}}</a></li>
            {%endfor%}
        </ul>
    </nav>
</main>
