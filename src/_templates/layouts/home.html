---
layout: "layouts/base.html"
bodyClass: "center relative"
---
<style>{%cssmin "includes/main-menu.css"%}</style>
<main aria-labelledby="main-title" class="box shadowed menu-wrapper relative">
    <h1 id="main-title" class="sky-text-bg brand grid" translate="no"><span>the</span> <span class="h-content">Hangman</span> <span>game</span></h1>
    <div class="menu column">
        <a aria-labelledby="play-btn" class="center shadowed rounded btn" data-theme="play" data-size="xl" href="/{{locale}}/categories" style="view-transition-name: play-button;">
            <svg width="54" height="51" style="filter: url(#a)">
                <title id="play-btn">{{ "play_now" | i18n: site.gameName }}</title>
                <use href="/assets/images/sprites.svg#play-button">
            </svg>
        </a>
        <div class="row" data-wrap="">
            <a class="shadowed btn" href="/{{locale}}/rules" style="view-transition-name: play;">{{ "how_to_play" | i18n }}</a>
            <a class="shadowed btn" href="/" style="view-transition-name: language-{{locale}};">{{ "lang_switch" | i18n }}</a>
        </div>
    </div>
</main>
<nav class="menu-nav" aria-labelledby="nav-title">
    <p id="nav-title" hidden>{{"more" | i18n}}</p>
    <p id="nav-list-label" hidden>{{"other_links" | i18n}}</p>
    <ul class="row" aria-labelledby="nav-list-label">
        <li aria-labelledby="achievements" data-r-space="sm">
            <a href="/{{locale}}/achievements" class="btn shadowed row " id="achievements" data-theme="secondary" style="view-transition-name: achievements;">
                <svg width="24" height="24" style="filter: drop-shadow(0 1px 2px rgb(0 0 0 / 30%))" aria-hidden="true">
                    <use href="/assets/images/sprites.svg#award">
                </svg>
                <span class="visually-hidden">{{"view" | i18n}}</span>
                <span> {{"my_badges" | i18n}}</span>
            </a>
        </li>
        <li aria-labelledby="credits" data-r-space="sm">
            <a href="/{{locale}}/credits" id="credits" class="btn shadowed row" data-theme="purple" style="view-transition-name: credits;">
                <svg width="24" height="24" style="filter: drop-shadow(0 1px 2px rgb(0 0 0 / 30%))" aria-hidden="true">
                    <use href="/assets/images/sprites.svg#info">
                </svg>
                {{"credits.name" | i18n}}
            </a>
        </li>
    </ul>
</nav>
