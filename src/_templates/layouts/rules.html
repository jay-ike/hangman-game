---
layout: "layouts/base.html"
---
<style>{%cssmin "includes/cards.css"%}</style>
<style>{%cssmin "includes/header.css"%}</style>
<main aria-labelledby="main-title" class="stack main-wrapper">
    <div class="row heading" data-variant="title-only">
        <a href="/{{locale}}" class="shadowed rounded btn" data-theme="secondary" data-size="sm" aria-labelledby="return">
            <svg width="25" height="24">
                <title id="return">{{ "return_home" | i18n }}</title>
                <use href="/assets/images/sprites.svg#back"/>
            </svg>
        </a>
        <h1 class="dilated-effect sky-text-bg heading-title" id="main-title">{{ "how_to_play" | i18n }}</h1>
    </div>
    <section class="column contain" aria-labelledby="rules-desc" data-scroll-view="fade-in" style="view-transition-name: play;">
        <p id="rules-desc" hidden>{{ "game_rules" | i18n }}</p>
        {%for rule in rules %}
        <article aria-labelledby="rule-{{rule.number}}" aria-describedby="rule-{{rule.number}}-desc" class="box structured-grid card" data-variant="rule">
            <h2 class="h3" id="rule-{{rule.number}}" class="card-title">{{rule.title}}</h2>
            <span class="card-action">{{rule.number}}</span>
            <p class="card-desc" id="rule-{{rule.number}}-desc">{{rule.description}}</p>
        </article>
        {%endfor%}
    </section>
</main>
